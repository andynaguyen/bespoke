[package]
name = "bespoke"
version = "0.9.7"
description = "Bespoke"
authors = ["Andy Nguyen"]
edition = "2021"
license = "MIT"
default-run = "bespoke"

[profile.dev]
incremental = true
# Keep file and line numbers in backtraces. For local variables in a debugger,
# build with CARGO_PROFILE_DEV_DEBUG=2.
debug = "line-tables-only"

# Dependencies skip debug info, which shortens clean builds.
[profile.dev.package."*"]
debug = 0

# The vendored shortcut crate keeps full debug info.
[profile.dev.package.handy-keys]
debug = 2

[[bin]]
name = "bespoke"
path = "src/main.rs"

[dependencies]
# UI. `runtime_shaders` compiles the Metal shaders at launch instead of at build
# time, so building does not need Xcode's separately downloaded Metal toolchain.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "0.5.1"

# Replacements for the Tauri plugins the settings app used.
tray-icon = "0.24.1"
global-hotkey = "0.8.0"
arboard = "3.6.1"
open = "5.3.3"
dirs = "6"
pulldown-cmark = { version = "0.13", default-features = false }
async-channel = "2"
parking_lot = "0.12"
sys-locale = "0.3"
auto-launch = "0.5.0"
image = { version = "0.25", default-features = false, features = ["png"] }

once_cell = "1"
rusqlite_migration = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = { git = "https://github.com/rustdesk-org/rdev" }
cpal = "0.16.0"
rtrb = "0.4.0"
anyhow = "1.0.95"
rubato = "0.16.2"
hound = "3.5.1"
log = "0.4.25"
env_filter = "0.1.0"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
earshot = "1.2.2"
enigo = "0.6.1"
rodio = { git = "https://github.com/cjpais/rodio.git" }
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate"] }
futures-util = "0.3"
rustfft = "6.4.0"
strsim = "0.11.0"
natural = "0.5.0"
regex = "1"
whatlang = "0.16"
isolang = "2"
chrono = { version = "0.4", features = ["unstable-locales"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tar = "0.4.44"
flate2 = "1.0"
sha2 = "0.10"
transcribe-rs = { version = "0.3.8", features = ["onnx"] }
transcribe-cpp = { version = "0.2.3", default-features = false }
handy-keys = "0.3.4"
ferrous-opencc = "0.2.3"
clap = { version = "4", features = ["derive"] }
hf-hub = { git = "https://github.com/cjpais/hf-hub", branch = "cancellable-downloads", features = [
  "tokio",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61.3", features = [
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "0.2.3", default-features = false, features = [
  "dynamic-backends",
  "vulkan",
] }

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.2.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "0.2.3", default-features = false, features = ["metal"] }
# Annotate: Scrawl's screen, voice and ink capture, vendored with Bespoke's patches.
scrawl = { path = "vendor/scrawl" }
# Annotate's MCP server for coding agents (`annotate::mcp`).
base64 = "0.22"
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-service-management = "0.3.2"
raw-window-handle = "0.6"
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
transcribe-cpp = { version = "0.2.3", default-features = false, features = [
  "dynamic-backends",
  "vulkan",
] }

[patch.crates-io]
# Native M6-M8 support until handy-keys ships these button mappings.
handy-keys = { path = "vendor/handy-keys" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.43.0", features = ["macros", "net", "io-util", "sync", "time", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
