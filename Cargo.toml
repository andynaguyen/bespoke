[package]
name = "bespoke"
version = "1.0.6"
description = "Bespoke"
authors = ["Andy Nguyen"]
edition = "2024"
license = "MIT"
default-run = "bespoke"

[profile.dev]
incremental = true
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[[bin]]
name = "bespoke"
path = "src/main.rs"

[dependencies]
# UI. `runtime_shaders` compiles the Metal shaders at launch instead of at build
# time, so building does not need Xcode's separately downloaded Metal toolchain.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "0.5.1"

tray-icon = "0.24.1"
global-hotkey = "0.8.0"
arboard = "3.6.1"
open = "5.3.3"
dirs = "6"
pulldown-cmark = { version = "0.13", default-features = false }
async-channel = "2"
parking_lot = "0.12"
sys-locale = "0.3"
auto-launch = "0.5.0"
image = { version = "0.25", default-features = false, features = ["png"] }

rusqlite_migration = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
cpal = "0.16.0"
rtrb = "0.4.0"
anyhow = "1.0.95"
bitflags = "2"
rubato = "0.16.2"
hound = "3.5.1"
log = "0.4.25"
env_filter = "0.1.0"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
earshot = "1.2.2"
enigo = "0.6.1"
rodio = { git = "https://github.com/cjpais/rodio.git" }
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate"] }
futures-util = "0.3"
rustfft = "6.4.0"
strsim = "0.11.0"
natural = "0.5.0"
regex = "1"
whatlang = "0.16"
isolang = "2"
chrono = { version = "0.4", features = ["unstable-locales"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
transcribe-rs = { version = "0.3.8", features = ["onnx"] }
transcribe-cpp = { version = "0.2.3", default-features = false }
ferrous-opencc = "0.2.3"
clap = { version = "4", features = ["derive"] }
hf-hub = { git = "https://github.com/cjpais/hf-hub", branch = "cancellable-downloads", features = [
  "tokio",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "0.2.3", default-features = false, features = ["metal"] }
base64 = "0.22"
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSPasteboard", "NSPasteboardItem"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
objc2-service-management = "0.3.2"
raw-window-handle = "0.6"
block2 = "0.6"
# Annotate: screen recording, ink overlay and contact sheets.
core-foundation = "0.10.0"
core-graphics = "0.24.0"
core-graphics-types = "0.1.3"
core-text = "21.0.0"
core-video = "0.4.3"
flume = "0.12.0"
metal = "0.29.0"
png = "0.18.1"
screencapturekit = { version = "=11.0.0", features = ["macos_15_0"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.43.0", features = ["macros", "net", "io-util", "sync", "time", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
