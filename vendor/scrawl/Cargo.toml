[package]
name = "scrawl"
version = "0.3.6"
edition = "2024"
license = "MIT"
publish = false
description = "Scrawl's macOS capture, vendored as a library for Bespoke's Annotate feature"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.95"
cpal = "0.16.0"
dirs = "7.0.0"
flume = "0.12.0"
hound = "3.5.1"
libc = "0.2"
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10.0"
core-graphics = "0.24.0"
core-graphics-types = "0.1.3"
core-text = "21.0.0"
core-video = "0.4.3"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
raw-window-handle = "0.6"
metal = "0.29.0"
screencapturekit = { version = "=11.0.0", features = ["macos_15_0"] }
