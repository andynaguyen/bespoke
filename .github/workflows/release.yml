name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      variant:
        type: string
        default: thin
      cold:
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.variant }}-${{ inputs.cold }}

jobs:
  release:
    # scrawl-helper needs the macOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(inputs.variant, 'off') && 'off' || inputs.variant == 'fat' && 'fat' || 'thin' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.variant == 'off16' && '16' || startsWith(inputs.variant, 'off') && '256' || inputs.variant == 'fat' && '1' || '16' }}
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ startsWith(inputs.variant, 'off-prebuilt-opt1') && '1' || '3' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Configure build concurrency
        run: |
          sysctl -n hw.logicalcpu
          sysctl -n hw.memsize
          if [[ "$VARIANT" == off-jobs2 ]]; then
            echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
          fi
          if [[ "$VARIANT" == off-codecs-pch ]]; then
            echo "TRANSCRIBE_CMAKE_ARGS=-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=$GITHUB_WORKSPACE/scripts/ci/transcribe-pch.cmake" >> "$GITHUB_ENV"
          fi
        env:
          VARIANT: ${{ inputs.variant }}

      - name: Identify the native toolchain
        id: native
        run: |
          echo "key=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.cold }}
        with:
          shared-key: release-${{ runner.os }}-${{ runner.arch }}-${{ steps.native.outputs.key }}

      - name: Verify a cold build
        if: inputs.cold
        run: |
          test ! -d target
          test ! -d "$HOME/.cargo/registry/src"
          test ! -d "$HOME/.cargo/git/checkouts"

      - name: Share Swift SDK modules within this job
        if: inputs.variant == 'off-prebuilt-opt1-shared'
        run: |
          module_cache="$RUNNER_TEMP/bespoke-swift-modules"
          test ! -e "$module_cache"
          mkdir -p "$module_cache"
          echo "BESPOKE_SWIFT_DRIVER=$(xcrun --find swift)" >> "$GITHUB_ENV"
          echo "BESPOKE_SWIFT_MODULE_CACHE=$module_cache" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/scripts/ci/swift-bin" >> "$GITHUB_PATH"

      - name: Fetch dependencies
        run: |
          cargo fetch --locked --target "$(rustc -vV | sed -n 's/^host: //p')"

      - name: Download the pinned native transcription dependency
        if: startsWith(inputs.variant, 'off-prebuilt')
        run: |
          scripts/ci/prepare-transcribe.sh "$RUNNER_TEMP/transcribe-native"
          echo "TRANSCRIBE_DIR=$RUNNER_TEMP/transcribe-native" >> "$GITHUB_ENV"

      - name: Compile release
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          config=()
          case "$VARIANT" in
            off-prebuilt-opt1*) config=(--config scripts/ci/release-dsp.toml) ;;
            off-prebuilt-ui1) config=(--config scripts/ci/release-ui.toml) ;;
          esac
          if [[ -n "${TRANSCRIBE_DIR:-}" ]]; then
            /usr/bin/time -l cargo rustc --release --locked --timings "${config[@]}" -- \
              -C 'link-arg=-Wl,-rpath,@executable_path/../Frameworks/Transcribe'
          else
            /usr/bin/time -l cargo build --release --locked --timings
          fi

      - name: Smoke test the release executable
        run: |
          if [[ -n "${TRANSCRIBE_DIR:-}" ]]; then
            DYLD_LIBRARY_PATH="$TRANSCRIBE_DIR/lib" target/release/bespoke --help > "$RUNNER_TEMP/help.txt"
            grep -q -- '--transcribe-file' "$RUNNER_TEMP/help.txt"
          else
            target/release/bespoke --list-models --json > "$RUNNER_TEMP/models.json"
            python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))' "$RUNNER_TEMP/models.json"
          fi

      # macOS keeps the Accessibility and Microphone grants across updates only
      # when the new copy is signed with the same identity as the old one.
      - name: Import the signing identity
        env:
          SIGNING_P12: ${{ secrets.BESPOKE_SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.BESPOKE_SIGNING_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          printf '%s' "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
            -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          security find-identity -p codesigning "$keychain" | grep -q '"Bespoke Local Signing"'

      - name: Build, sign and publish
        env:
          # Rust cache pruning removes executables from downloaded frameworks.
          BESPOKE_SPARKLE_CACHE: ${{ runner.temp }}/sparkle
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && '--publish' || '' }}
        run: scripts/release.sh --no-build $PUBLISH

      - name: Smoke test the relocated bundle
        if: startsWith(inputs.variant, 'off-prebuilt')
        run: |
          ditto -x -k dist/*/Bespoke-*.zip "$RUNNER_TEMP/relocated"
          bundle="$RUNNER_TEMP/relocated/Bespoke.app"
          codesign --verify --deep --strict "$bundle"
          env -u DYLD_LIBRARY_PATH "$bundle/Contents/MacOS/bespoke" --list-devices > "$RUNNER_TEMP/devices.txt"
          cat "$RUNNER_TEMP/devices.txt"
          grep -qi metal "$RUNNER_TEMP/devices.txt"

      - if: github.event_name != 'push' || startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: bespoke-release-${{ inputs.variant || 'thin' }}
          path: |
            dist/
            target/cargo-timings/
