name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      runner-image:
        type: string
        default: macos-26
      developer-directory:
        type: string
        default: /Applications/Xcode.app/Contents/Developer
      dependency-artifacts:
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    # scrawl-helper needs the macOS 26 SDK.
    runs-on: ${{ inputs.runner-image || 'macos-26' }}
    timeout-minutes: 120
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      DEVELOPER_DIR: ${{ inputs.developer-directory || '/Applications/Xcode.app/Contents/Developer' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify a cold build
        run: |
          test ! -d target
          test ! -d "$HOME/.cargo/registry/src"
          test ! -d "$HOME/.cargo/git/checkouts"

      - name: Fetch dependencies
        run: |
          cargo fetch --locked --target "$(rustc -vV | sed -n 's/^host: //p')"

      - name: Download the pinned native transcription dependency
        run: |
          scripts/ci/prepare-transcribe.sh "$RUNNER_TEMP/transcribe-native"
          echo "TRANSCRIBE_DIR=$RUNNER_TEMP/transcribe-native" >> "$GITHUB_ENV"

      - name: Normalize source timestamps
        if: inputs.dependency-artifacts
        run: python3 scripts/ci/cold-dependencies.py prepare

      - name: Download each dependency group as it finishes
        if: inputs.dependency-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/cold-dependencies.py download --directory "$RUNNER_TEMP/cold-deps"

      - name: Restore dependencies compiled during this run
        if: inputs.dependency-artifacts
        run: python3 scripts/ci/cold-dependencies.py restore --directory "$RUNNER_TEMP/cold-deps"

      - name: Compile release
        env:
          CARGO_LOG: ${{ inputs.dependency-artifacts && 'cargo::core::compiler::fingerprint=info' || '' }}
        run: |
          /usr/bin/time -l cargo rustc --release --locked --timings \
            --config scripts/ci/release-dsp.toml -- \
            -C 'link-arg=-Wl,-rpath,@executable_path/../Frameworks/Transcribe'

      - name: Smoke test the release executable
        run: |
          DYLD_LIBRARY_PATH="$TRANSCRIBE_DIR/lib" target/release/bespoke --help > "$RUNNER_TEMP/help.txt"
          grep -q -- '--transcribe-file' "$RUNNER_TEMP/help.txt"

      # macOS keeps the Accessibility and Microphone grants across updates only
      # when the new copy is signed with the same identity as the old one.
      - name: Import the signing identity
        env:
          SIGNING_P12: ${{ secrets.BESPOKE_SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.BESPOKE_SIGNING_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          printf '%s' "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
            -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          security find-identity -p codesigning "$keychain" | grep -q '"Bespoke Local Signing"'

      - name: Build, sign and publish
        env:
          BESPOKE_SPARKLE_CACHE: ${{ runner.temp }}/sparkle
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && '--publish' || '' }}
        run: scripts/release.sh --no-build $PUBLISH

      - name: Smoke test the relocated bundle
        run: |
          ditto -x -k dist/*/Bespoke-*.zip "$RUNNER_TEMP/relocated"
          bundle="$RUNNER_TEMP/relocated/Bespoke.app"
          codesign --verify --deep --strict "$bundle"
          env -u DYLD_LIBRARY_PATH "$bundle/Contents/MacOS/bespoke" --list-devices > "$RUNNER_TEMP/devices.txt"
          cat "$RUNNER_TEMP/devices.txt"
          grep -qi metal "$RUNNER_TEMP/devices.txt"

      - if: github.event_name != 'push' || startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: bespoke-release
          path: |
            dist/
            target/cargo-timings/
