name: Release benchmark

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      variant:
        description: Release profile to measure
        type: choice
        default: thin
        options: [thin, fat]

permissions:
  contents: write

jobs:
  measure:
    uses: ./.github/workflows/release.yml
    with:
      variant: ${{ inputs.variant || 'thin' }}
    secrets: inherit
