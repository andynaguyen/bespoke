name: Release benchmark

on:
  push:
    branches: ["main", "andy/speed-up-release-ci"]
  workflow_dispatch:
    inputs:
      variant:
        description: Release profile to measure
        type: choice
        default: thin
        options: [thin, fat]

permissions:
  contents: write

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        variant: ["${{ inputs.variant || 'thin' }}"]
    uses: ./.github/workflows/release.yml
    with:
      variant: ${{ matrix.variant }}
    secrets: inherit
