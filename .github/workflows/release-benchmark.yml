name: Release benchmark

on:
  push:
    branches: ["andy/speed-up-release-ci"]
  workflow_dispatch:
    inputs:
      variant:
        description: Release profile to measure
        type: choice
        default: off-prebuilt-opt1-shared
        options: [off-prebuilt-opt1-shared, off-prebuilt-opt1-media, off-prebuilt-opt1, off-prebuilt-ui1, off-prebuilt, off-codecs, off-codecs-pch, off-platform, off, off-jobs2, thin, fat]

permissions:
  contents: write

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.variant)) || fromJSON('["off-prebuilt-opt1-media", "off-prebuilt-opt1-shared"]') }}
    uses: ./.github/workflows/release.yml
    with:
      variant: ${{ matrix.variant }}
      cold: true
    secrets: inherit

  budget:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Check complete release jobs against eight minutes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 scripts/ci/measure-release.py "$GITHUB_RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"
