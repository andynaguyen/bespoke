name: Triage report
description: Filed from Bespoke's Triage an Issue, where a coding agent investigated the Mac. Write other reports as a blank issue.
labels:
  - via-triage
body:
  - type: markdown
    attributes:
      value: |
        Triage agents follow this structure (`.github/triage/PLAYBOOK.md`). Keep one problem per
        issue, and remove API keys, tokens and your home folder path from anything you paste.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The problem in the user's own words.
    validations:
      required: true

  - type: textarea
    id: diagnosis
    attributes:
      label: Diagnosis
      description: What the investigation found, grounded in logs and source.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest steps that reproduce it, if any were found.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The Bespoke version the bug happened on, or unknown.
      placeholder: 1.0.2
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Mac model or chip, build (Sparkle release, local build, debug build), and the permissions that matter.
      placeholder: macOS 26.1, Apple M3, Sparkle release, Screen Recording off
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Only the most relevant lines from bespoke.log or annotate.log, redacted.
      render: shell

  - type: input
    id: related
    attributes:
      label: Related issues
      description: Existing issues that look similar, and why this is not a duplicate.

  - type: textarea
    id: workaround
    attributes:
      label: Fix applied or workaround
      description: Anything that was run on the Mac to unblock the user.

  - type: input
    id: agent
    attributes:
      label: Filed by
      description: Which agent and model produced this report.
      placeholder: Claude Code (claude-opus-5-5) via Bespoke triage
